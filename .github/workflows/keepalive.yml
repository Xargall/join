# .github/workflows/keepalive.yml
name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 * * 1,4'   # jeden Montag & Donnerstag, 06:00 UTC
  workflow_dispatch:         # manuell antriggerbar zum Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/contacts?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
